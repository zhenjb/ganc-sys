services:
  postgres:
    image: postgres:16
    container_name: ganc_sys_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ganc
      POSTGRES_PASSWORD: ganc
      POSTGRES_DB: ganc_sys
    ports:
      - "5432:5432"
    volumes:
      - ganc_sys_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganc -d ganc_sys"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ganc_sys_postgres_data: